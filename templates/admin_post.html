{% extends 'base.html' %}

{% block content %}
<section class="panel">
  <h2>Content Alteration Panel</h2>
  <p class="muted">Edit banner, tune the blog narrative, and approve once quality matches human editorial standards.</p>

  <form class="form" method="post" action="{{ url_for('approve_post', post_id=post.id) }}">
    <label>
      Banner
      <input type="text" name="banner" value="{{ post.banner }}" />
    </label>
    <label>
      Content (HTML supported: h1/h2/h3, ul/ol, p)
      <textarea name="content" rows="16">{{ post.content }}</textarea>
    </label>
    <label>
      Approved By
      <input type="text" name="approved_by" placeholder="Admin name" />
    </label>
    <div class="button-row">
      <button class="button primary" type="submit">Approve & Publish</button>
    </div>
  </form>

  <form class="form" method="post" action="{{ url_for('needs_edit', post_id=post.id) }}">
    <input type="hidden" name="banner" value="{{ post.banner }}" />
    <input type="hidden" name="content" value="{{ post.content }}" />
    <button class="button secondary" type="submit">Request Changes</button>
  </form>
</section>
{% endblock %}
